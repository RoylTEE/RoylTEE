[workspace]
resolver = "2"
members = [
    "contracts/vault",
    "contracts/mock-usdc",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }
