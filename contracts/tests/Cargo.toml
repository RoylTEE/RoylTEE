[package]
name = "sandbox_tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

# near-workspaces integration tests. They need the wasm files in
# contracts/res/ (run `npm run build:wasm` first; `npm run test` does it).
# near-workspaces downloads its sandbox node binary on first run.

[lib]
path = "lib.rs"

[dev-dependencies]
anyhow = "1"
near-workspaces = "0.24.0"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
