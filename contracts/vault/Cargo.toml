[package]
name = "vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The vault is written against the raw NEAR host functions (near-sys), with
# no SDK, no allocator and no JSON parser, so the whole attack surface fits
# on one screen and each vault account stays small.

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
near-sys = "=0.4.1"

[lints]
workspace = true
